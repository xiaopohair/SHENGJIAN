<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>声键 · GitHub 社交预览</title>
<style>
  :root{
    --ink:#0B0F14; --panel:#10161E; --teal:#5AC8AA; --mint:#8BE0C7;
    --text:#E9EFF7; --muted:#8B99AC; --line:#263140;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{
    background:
      radial-gradient(900px 520px at 12% 8%, rgba(90,200,170,.16), transparent 62%),
      radial-gradient(700px 420px at 92% 96%, rgba(90,200,170,.07), transparent 60%),
      var(--ink);
    color:var(--text);
    font-family:"Segoe UI Variable","Segoe UI","Microsoft YaHei UI",sans-serif;
    position:relative;
  }
  .grid{
    position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.25));
  }
  .frame{position:absolute;inset:0;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:14px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 14px rgba(90,200,170,.8)}
  .kicker{font-size:12px;letter-spacing:.32em;color:var(--muted);font-weight:600}
  .main{display:flex;align-items:center;justify-content:space-between;gap:40px}
  .left{display:flex;flex-direction:column;gap:26px}
  .lock{width:470px;height:auto}
  .slogan{font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;font-weight:300;font-size:44px;letter-spacing:.02em;line-height:1.15;margin:0}
  .slogan b{font-weight:700;color:var(--mint)}
  .en{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .chips{display:flex;gap:10px;margin-top:4px}
  .chip{font-size:12px;color:#C6D4E2;border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;padding:7px 14px;letter-spacing:.04em}
  .right{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center;flex:none}
  .halo{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle, rgba(90,200,170,.26), transparent 66%)}
  .icon{width:260px;height:260px;position:relative;filter:drop-shadow(0 26px 60px rgba(0,0,0,.55))}
  .bottom{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.12em}
  .bottom .mono{font-family:"Cascadia Mono","Consolas",monospace;letter-spacing:.08em;color:#6E7C8C}
  .wave{display:flex;align-items:flex-end;gap:4px;height:16px}
  .wave i{display:block;width:3px;border-radius:2px;background:var(--teal);opacity:.7}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame">
    <div class="top"><span class="dot"></span><span class="kicker">SHENGJIAN · VOICE REMOTE FOR WINDOWS</span></div>

    <div class="main">
      <div class="left">
        <img class="lock" src="../logo/shengjian-lockup-horizontal-dark.svg" alt="声键">
        <h1 class="slogan">声音，就是<b>快捷键</b>。</h1>
        <div class="en">Your voice is the shortcut.</div>
        <div class="chips">
          <span class="chip">语音输入</span>
          <span class="chip">按键映射</span>
          <span class="chip">宏与方案</span>
        </div>
      </div>
      <div class="right">
        <div class="halo"></div>
        <img class="icon" src="../logo/shengjian-app-icon.svg" alt="声键应用图标">
      </div>
    </div>

    <div class="bottom">
      <div>小米蓝牙语音遥控器 → Windows 10 / 11</div>
      <div class="mono">GPL-3.0 · 0.1.0</div>
    </div>
  </div>
</body>
</html>
