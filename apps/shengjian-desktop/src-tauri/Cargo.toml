[package]
name = "shengjian-desktop"
version = "0.4.1"
description = "Shengjian desktop shell"
edition = "2021"
rust-version = "1.77"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shengjian-app = { path = "../../../crates/shengjian-app" }
shengjian-contract = { path = "../../../crates/shengjian-contract" }
shengjian-domain = { path = "../../../crates/shengjian-domain" }

[target.'cfg(windows)'.dependencies]
shengjian-windows = { path = "../../../crates/shengjian-windows" }
shengjian-windows-adapter = { path = "../../../crates/shengjian-windows-adapter" }
