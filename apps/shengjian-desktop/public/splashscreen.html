<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>声键</title>
    <style>
      :root {
        color-scheme: dark;
        --splash-bg: #0b0f14;
        --splash-surface: #10161e;
        --splash-text: #e9eff7;
        --splash-muted: #8b99ac;
        --splash-accent: #5ac8aa;
        --splash-border: rgba(90, 200, 170, 0.16);
        --splash-glow: rgba(90, 200, 170, 0.12);
        --splash-ease: cubic-bezier(0.22, 1, 0.36, 1);
        font-family:
          "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui,
          sans-serif;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --splash-bg: #f4f6f9;
          --splash-surface: #ffffff;
          --splash-text: #18212c;
          --splash-muted: #5f6d7e;
          --splash-accent: #0f7a63;
          --splash-border: rgba(15, 122, 99, 0.18);
          --splash-glow: rgba(15, 122, 99, 0.1);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: grid;
        place-items: stretch;
      }

      .splash {
        position: relative;
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        overflow: hidden;
        border: 1px solid var(--splash-border);
        border-radius: 18px;
        background:
          radial-gradient(120% 90% at 50% 0%, var(--splash-glow), transparent 62%),
          linear-gradient(180deg, var(--splash-surface) 0%, var(--splash-bg) 58%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        user-select: none;
        -webkit-user-select: none;
      }

      .splash::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 18px 18px;
        -webkit-mask-image: radial-gradient(80% 70% at 50% 32%, #000 0%, transparent 100%);
        mask-image: radial-gradient(80% 70% at 50% 32%, #000 0%, transparent 100%);
      }

      .brand {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        animation: rise 420ms var(--splash-ease) both;
      }

      .mark {
        display: block;
        width: auto;
        height: 54px;
        filter: drop-shadow(0 6px 18px rgba(90, 200, 170, 0.18));
      }

      .mark--light {
        display: none;
      }

      @media (prefers-color-scheme: light) {
        .mark--dark {
          display: none;
        }

        .mark--light {
          display: block;
        }
      }

      .name {
        color: var(--splash-text);
        font-size: 24px;
        font-weight: 650;
        letter-spacing: 0.06em;
        line-height: 1.1;
      }

      .name-en {
        margin-top: -4px;
        color: var(--splash-muted);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.34em;
        line-height: 1;
      }

      .tagline {
        position: relative;
        margin: 0;
        color: var(--splash-muted);
        font-size: 12px;
        letter-spacing: 0.04em;
        animation: rise 520ms 60ms var(--splash-ease) both;
      }

      .progress {
        position: relative;
        width: 128px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, var(--splash-text) 10%, transparent);
        animation: rise 600ms 120ms var(--splash-ease) both;
      }

      .progress::after {
        content: "";
        position: absolute;
        inset-block: 0;
        width: 46%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--splash-accent), transparent);
        animation: sweep 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }

      .status {
        position: relative;
        margin: 0;
        color: var(--splash-muted);
        font-size: 11px;
        letter-spacing: 0.08em;
        animation: rise 640ms 160ms var(--splash-ease) both;
      }

      @keyframes sweep {
        from {
          transform: translateX(-130%);
        }

        to {
          transform: translateX(330%);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }

        to {
          opacity: 1;
          transform: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .brand,
        .tagline,
        .progress,
        .status {
          animation: none;
        }

        .progress::after {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="声键正在启动">
      <div class="brand">
        <svg
          class="mark mark--dark"
          xmlns="http://www.w3.org/2000/svg"
          width="200"
          height="165"
          viewBox="12 14 40 33"
          aria-hidden="true"
        >
          <title>声键</title>
          <defs>
            <linearGradient
              id="splash-mark-dark"
              gradientUnits="userSpaceOnUse"
              x1="32"
              y1="14"
              x2="32"
              y2="47"
            >
              <stop offset="0" stop-color="#8BE0C7" />
              <stop offset="0.55" stop-color="#5AC8AA" />
              <stop offset="1" stop-color="#3FA98C" />
            </linearGradient>
            <mask
              id="splash-cut-dark"
              maskUnits="userSpaceOnUse"
              x="10"
              y="12"
              width="44"
              height="37"
            >
              <path
                d="M 24.50 14.00 L 39.50 14.00 Q 46.00 14.00 47.16 20.40 L 50.84 40.60 Q 52.00 47.00 45.50 47.00 L 18.50 47.00 Q 12.00 47.00 13.16 40.60 L 16.84 20.40 Q 18.00 14.00 24.50 14.00 Z"
                fill="#fff"
              />
              <rect x="18.0" y="25.0" width="7.0" height="11.0" rx="3.5" fill="#000" />
              <rect x="28.5" y="20.5" width="7.0" height="20.0" rx="3.5" fill="#000" />
              <rect x="39.0" y="23.5" width="7.0" height="14.0" rx="3.5" fill="#000" />
            </mask>
          </defs>
          <g mask="url(#splash-cut-dark)">
            <path
              d="M 24.50 17.00 L 39.50 17.00 Q 46.00 17.00 47.27 23.37 L 50.73 40.63 Q 52.00 47.00 45.50 47.00 L 18.50 47.00 Q 12.00 47.00 13.27 40.63 L 16.73 23.37 Q 18.00 17.00 24.50 17.00 Z"
              fill="#2E8F76"
            />
            <path
              d="M 24.50 14.00 L 39.50 14.00 Q 46.00 14.00 47.27 20.37 L 50.73 37.63 Q 52.00 44.00 45.50 44.00 L 18.50 44.00 Q 12.00 44.00 13.27 37.63 L 16.73 20.37 Q 18.00 14.00 24.50 14.00 Z"
              fill="url(#splash-mark-dark)"
            />
          </g>
        </svg>

        <svg
          class="mark mark--light"
          xmlns="http://www.w3.org/2000/svg"
          width="200"
          height="165"
          viewBox="12 14 40 33"
          aria-hidden="true"
        >
          <title>声键</title>
          <defs>
            <linearGradient
              id="splash-mark-light"
              gradientUnits="userSpaceOnUse"
              x1="32"
              y1="14"
              x2="32"
              y2="47"
            >
              <stop offset="0" stop-color="#1E9A7E" />
              <stop offset="0.55" stop-color="#0F7A63" />
              <stop offset="1" stop-color="#0A5A49" />
            </linearGradient>
            <mask
              id="splash-cut-light"
              maskUnits="userSpaceOnUse"
              x="10"
              y="12"
              width="44"
              height="37"
            >
              <path
                d="M 24.50 14.00 L 39.50 14.00 Q 46.00 14.00 47.16 20.40 L 50.84 40.60 Q 52.00 47.00 45.50 47.00 L 18.50 47.00 Q 12.00 47.00 13.16 40.60 L 16.84 20.40 Q 18.00 14.00 24.50 14.00 Z"
                fill="#fff"
              />
              <rect x="18.0" y="25.0" width="7.0" height="11.0" rx="3.5" fill="#000" />
              <rect x="28.5" y="20.5" width="7.0" height="20.0" rx="3.5" fill="#000" />
              <rect x="39.0" y="23.5" width="7.0" height="14.0" rx="3.5" fill="#000" />
            </mask>
          </defs>
          <g mask="url(#splash-cut-light)">
            <path
              d="M 24.50 17.00 L 39.50 17.00 Q 46.00 17.00 47.27 23.37 L 50.73 40.63 Q 52.00 47.00 45.50 47.00 L 18.50 47.00 Q 12.00 47.00 13.27 40.63 L 16.73 23.37 Q 18.00 17.00 24.50 17.00 Z"
              fill="#08493B"
            />
            <path
              d="M 24.50 14.00 L 39.50 14.00 Q 46.00 14.00 47.27 20.37 L 50.73 37.63 Q 52.00 44.00 45.50 44.00 L 18.50 44.00 Q 12.00 44.00 13.27 37.63 L 16.73 20.37 Q 18.00 14.00 24.50 14.00 Z"
              fill="url(#splash-mark-light)"
            />
          </g>
        </svg>

        <div class="name">声键</div>
        <div class="name-en">SHENGJIAN</div>
      </div>

      <p class="tagline" id="tagline">声音，就是快捷键。</p>
      <div class="progress" role="progressbar" aria-label="启动进度" aria-valuetext="正在启动"></div>
      <p class="status" id="status" role="status" aria-live="polite">正在启动…</p>
    </main>

    <script>
      (() => {
        const stored = (localStorage.getItem("shengjian-language") || "").toLowerCase();
        const systemChinese = (navigator.language || "zh").toLowerCase().startsWith("zh");
        const chinese =
          stored === "en"
            ? false
            : stored === "zh-hans" || stored === "zh"
              ? true
              : systemChinese;
        document.documentElement.lang = chinese ? "zh-CN" : "en";
        document.getElementById("tagline").textContent = chinese
          ? "声音，就是快捷键。"
          : "Your voice is the shortcut.";
        document.getElementById("status").textContent = chinese ? "正在启动…" : "Starting…";
        const progress = document.querySelector(".progress");
        progress.setAttribute("aria-label", chinese ? "启动进度" : "Startup progress");
        progress.setAttribute("aria-valuetext", chinese ? "正在启动" : "Starting");
        document
          .querySelector(".splash")
          .setAttribute("aria-label", chinese ? "声键正在启动" : "SHENGJIAN is starting");
      })();
    </script>
  </body>
</html>
